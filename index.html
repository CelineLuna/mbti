<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBTI 人格测试 · 40 题沉浸版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23F5A623'/%3E%3Ccircle cx='25' cy='29' r='4' fill='%234A3A23'/%3E%3Ccircle cx='39' cy='29' r='4' fill='%234A3A23'/%3E%3Cpath d='M23 39 Q32 48 41 39' stroke='%234A3A23' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&amp;display=swap">
<style>
/* ===== 设计令牌：浅黄圆润系 ===== */
:root{
  --bg:#FFF6DC;            /* 柔和浅黄主背景 */
  --bg-soft:#FFFDF4;       /* 浅色卡片底 */
  --card:#FFFFFF;
  --ink:#4A3A23;           /* 主文字：暖深棕，与浅黄高对比 */
  --ink-soft:#6F5B3C;      /* 次级文字 */
  --accent:#F5A623;        /* 暖橙强调 */
  --accent-strong:#E8890C;
  --accent-soft:#FFE9C2;
  --warm:#FFD98A;
  --cool:#8FA8D8;          /* I 型冷色 */
  --cool-soft:#DCE7F6;
  --cool-deep:#5B79B8;
  --danger:#C96A2B;
  --ok:#6FA05C;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --shadow:0 10px 24px rgba(214,164,74,.18);
  --font-d:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --font-b:"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Source Han Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-b);background:var(--bg);color:var(--ink);
  line-height:1.7;min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .5s ease;
}
/* 星空画布（动态掉落背景，独立层，不参与交互） */
#stars{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:30px 20px 52px;min-height:100vh}
/* ===== 视图切换（轻量过渡） ===== */
.view{display:none;animation:fadeUp .28s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .view{animation:none}
  .bar-fill,.opt{transition:none!important}
}
/* ===== 通用组件 ===== */
.card{background:var(--card);border-radius:var(--r-lg);padding:22px 20px;box-shadow:var(--shadow)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:54px;padding:14px 18px;border:0;border-radius:999px;
  font-family:var(--font-b);font-size:17px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-strong));
  box-shadow:0 8px 18px rgba(232,137,12,.28);transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.04)}
.btn.ghost{background:#FFF3D6;color:var(--accent-strong);box-shadow:none;border:2px solid var(--accent-soft)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.quiet{background:#F2EAD7;color:var(--ink-soft);box-shadow:none}
.btn.quiet:hover{background:#EBE0C8}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn-row{display:flex;gap:12px;margin-top:22px}
.btn-row .btn{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--accent-strong);background:var(--accent-soft)}
/* Toast 轻提示 */
#toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-70px);
  background:var(--ink);color:#FFF8E7;font-size:14.5px;padding:10px 20px;border-radius:999px;
  box-shadow:0 10px 24px rgba(74,58,35,.28);z-index:99;opacity:0;transition:transform .25s ease,opacity .25s ease;pointer-events:none;
  max-width:86vw;text-align:center;
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
/* ===== 开始页 ===== */
.start-wrap{text-align:center;padding-top:8vh}
.start-logo{width:86px;height:86px;margin:0 auto 20px;display:block}
.start-title{
  font-family:var(--font-d);font-size:38px;line-height:1.25;letter-spacing:.5px;
  color:var(--ink);
}
.start-sub{margin-top:12px;color:var(--ink-soft);font-size:15.5px}
.start-card{margin-top:30px;text-align:left}
.start-card .row{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:15px;color:var(--ink)}
.start-card .row .dot{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.start-actions{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.start-note{margin-top:18px;font-size:13px;color:var(--ink-soft)}
/* ===== 答题页 ===== */
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.quiz-count{font-family:var(--font-d);font-size:18px;color:var(--ink)}
.progress{flex:1;height:12px;border-radius:999px;background:#F3E4BC;overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-strong));transition:width .3s ease}
.quiz-card{margin-top:6px}
.q-type{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:var(--accent);border-radius:999px;padding:2px 10px;margin-bottom:8px;letter-spacing:.5px}
.q-text{font-size:19px;font-weight:800;line-height:1.6;margin-bottom:6px}
.q-dim{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
.q-options{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  background:var(--card);border:2px solid #F2E3BC;border-radius:var(--r-md);
  padding:15px 16px;min-height:56px;font-family:var(--font-b);font-size:15.5px;color:var(--ink);
  cursor:pointer;transition:border-color .18s ease,background .18s ease,transform .12s ease;
}
.opt:active{transform:scale(.985)}
.opt:hover{border-color:var(--warm)}
.opt .mark{
  flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;
  border:2px solid #D9BC7E;background:#fff;position:relative;transition:all .18s ease;
}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{border-color:var(--accent-strong);background:var(--accent)}
.opt.sel .mark::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
/* 判断题：两个选项时略作区分 */
.q-options.judge .opt{min-height:60px}
.q-actions{margin-top:22px}
.shake{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ===== 结果页 ===== */
.result-head{text-align:center}
.result-emoji{width:92px;height:92px;margin:0 auto 12px;display:block}
.result-emoji.anime{width:112px;height:112px;filter:drop-shadow(0 8px 18px rgba(120,90,40,.18))}
.result-type{
  font-family:var(--font-d);font-size:46px;letter-spacing:6px;line-height:1.15;color:var(--ink);
}
.result-name{margin-top:6px;font-size:18px;font-weight:800;color:var(--ink)}
.result-badge-wrap{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.result-badge-wrap .badge{color:var(--ink);background:#F6E7C0;font-size:13px;padding:4px 13px}
.result-desc{margin-top:18px}
.result-desc p{font-size:15px;color:var(--ink);text-align:left}
.dim-title{margin:24px 0 4px;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.dim-title .bal{font-size:11.5px;font-weight:700;color:#fff;background:var(--ok);border-radius:999px;padding:2px 9px}
.bar-wrap{margin-top:10px}
.bar{
  display:flex;height:16px;border-radius:999px;overflow:hidden;background:#EFE0B8;
}
.bar .half{flex:1;position:relative;height:100%}
.bar .half + .half{border-left:3px solid var(--bg)}
.bar .fill{position:absolute;top:0;height:100%;border-radius:999px;transition:width .5s ease}
.bar .fill.left{right:0;background:linear-gradient(90deg,var(--accent-strong),var(--accent))}
.bar .fill.right{left:0;background:linear-gradient(90deg,var(--cool-deep),var(--cool))}
.bar-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--ink-soft)}
.bar-labels b{color:var(--ink);font-size:14px}
.bar-labels .strong{color:var(--accent-strong)}
.tone-cool .bar-labels .strong{color:var(--cool-deep)}
/* E/I 双色调主题 */
body.tone-warm{background:var(--bg)}
body.tone-cool{background:#E9F1FB}
body.tone-cool .quiz-count,body.tone-cool .start-title,body.tone-cool .result-type{color:#33415E}
body.tone-cool .opt.sel{border-color:var(--cool-deep);background:var(--cool-soft)}
body.tone-cool .opt.sel .mark{border-color:var(--cool-deep);background:var(--cool-deep)}
body.tone-cool .btn:not(.ghost):not(.quiet){background:linear-gradient(135deg,var(--cool),var(--cool-deep));box-shadow:0 8px 18px rgba(91,121,184,.25)}
body.tone-cool .btn.ghost{background:#FFF;color:var(--cool-deep);border-color:var(--cool-soft)}
body.tone-cool .progress i{background:linear-gradient(90deg,var(--cool),var(--cool-deep))}
body.tone-cool .result-badge-wrap .badge{background:#D5E2F5;color:#33415E}
body.tone-cool .q-type{background:var(--cool-deep)}
.list-card{margin-top:16px}
.list-card h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.list-card ul{list-style:none}
.list-card li{position:relative;padding:4px 0 4px 26px;font-size:14.5px;color:var(--ink)}
.list-card li::before{content:"";position:absolute;left:4px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--accent-soft)}
.list-card li b{font-weight:800}
.tone-cool .list-card li::before{background:var(--cool-soft)}
.lc-grid{display:flex;flex-direction:column;gap:16px}
@media (min-width:520px){.lc-grid{flex-direction:row}.lc-grid .list-card{flex:1}}
.result-actions{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.foot-note{margin-top:26px;font-size:12px;color:var(--ink-soft);text-align:center}
/* ===== 桌面端优化 ===== */
@media (min-width:768px){
  .app{padding:36px 24px 64px}
  .start-title{font-size:44px}
  .q-text{font-size:20px}
}
</style>
</head>

<section id="view-start" class="view">

<section id="view-result" class="view">

<script>
"use strict";

/* ===== 动态星空背景：星星缓慢掉落 + 闪烁 + 偶发流星 ===== */
(function starfield(){
  const cv = document.getElementById("stars");
  if(!cv) return;
  const ctx = cv.getContext("2d");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, stars = [], meteors = [];

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(40, Math.min(150, Math.round((W * H) / 11000)));
    stars = [];
    for(let i = 0; i < n; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.7 + 0.5,
        a: Math.random() * 0.55 + 0.22,
        sp: Math.random() * 0.32 + 0.10,
        tw: Math.random() * Math.PI * 2,
        tws: Math.random() * 0.02 + 0.004,
        gold: Math.random() < 0.55
      });
    }
  }
  function drawStar(s){
    const alpha = s.a * (0.62 + 0.38 * Math.sin(s.tw));
    ctx.beginPath();
    ctx.fillStyle = s.gold ? "rgba(245,183,90," + alpha + ")" : "rgba(150,180,235," + alpha + ")";
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  function staticFrame(){
    ctx.clearRect(0, 0, W, H);
    for(const s of stars) drawStar(s);
  }
  function loop(){
    ctx.clearRect(0, 0, W, H);
    for(const s of stars){
      s.y += s.sp;
      s.tw += s.tws;
      if(s.y - s.r > H){ s.y = -s.r; s.x = Math.random() * W; }
      drawStar(s);
    }
    if(Math.random() < 0.006){
      meteors.push({ x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 1.4, vy: Math.random() * 4 + 3.2, life: 1 });
    }
    for(let i = meteors.length - 1; i >= 0; i--){
      const m = meteors[i];
      m.x += m.vx; m.y += m.vy; m.life -= 0.008;
      if(m.life <= 0 || m.y > H + 24){ meteors.splice(i, 1); continue; }
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 9, m.y - m.vy * 9);
      g.addColorStop(0, "rgba(255,236,170," + (0.75 * m.life) + ")");
      g.addColorStop(1, "rgba(255,236,170,0)");
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * 9, m.y - m.vy * 9);
      ctx.stroke();
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  resize();
  if(reduce){ staticFrame(); window.addEventListener("resize", staticFrame); }
  else { loop(); }
})();

/* ===== 题库数据（40 题：30 单选 + 10 判断，四维度各 10 题，均衡分布） =====
   每题：id（仅作标识，计分按数组下标）/ dim（EI/SN/TF/JP）/ question / judge（判断题标记）
   options：每个选项有隐藏分值，+ 指向正极字母（E/S/T/J），- 指向负极字母（I/N/F/P）。
   单选 4 项梯度 +2/+1/-1/-2；判断 2 项 +2/-2。界面不显示分值。 */
const QUESTIONS = [
  /* ========== E/I 维度（8 单选 + 2 判断） ========== */
  { id:1, dim:"EI", question:"忙完一周到了周五晚上，你更想怎么安排？", options:[
    { text:"叫上朋友出去走走，热闹一下才算放松", score:2 },
    { text:"约一两个熟人小聚，聊聊天就很好", score:1 },
    { text:"窝在家追剧打游戏，自己待着最自在", score:-1 },
    { text:"只想安静独处，谁也别来打扰我", score:-2 } ]},
  { id:2, dim:"EI", question:"到了一个全新环境（新班级、新公司），你通常？", options:[
    { text:"主动和周围人打招呼，很快熟络起来", score:2 },
    { text:"先和坐得近的人聊聊，慢慢融入", score:1 },
    { text:"等别人先开口，我再顺势接话", score:-1 },
    { text:"尽量少说话，先自己安静观察一阵", score:-2 } ]},
  { id:3, dim:"EI", judge:true, question:"在人多的场合，我通常越聊越有精神，一个人待久了反而有点闷。", options:[
    { text:"符合我", score:2 },
    { text:"不太符合", score:-2 } ]},
  { id:4, dim:"EI", question:"手机没电、一整天联系不上外界，你会？", options:[
    { text:"挺不习惯，总担心错过什么要紧事", score:2 },
    { text:"有点惦记，但还能忍一忍", score:1 },
    { text:"正好清静，感觉挺放松", score:-1 },
    { text:"太舒服了，希望天天这样", score:-2 } ]},
  { id:5, dim:"EI", question:"遇到一道想不通的难题，你更可能？", options:[
    { text:"找人一起讨论，说着说着就有思路了", score:2 },
    { text:"先跟人聊聊，再自己慢慢消化", score:1 },
    { text:"自己先琢磨，实在卡住再找人问", score:-1 },
    { text:"一个人慢慢想，不想被打断", score:-2 } ]},
  { id:6, dim:"EI", question:"连续社交一整天后，你通常觉得？", options:[
    { text:"越聊越有劲，还想接着玩", score:2 },

    desc:"你是目标感极强的统帅，习惯把宏大构想变成清晰路线图。你果断、自信，讨厌含糊和犹豫，天生享受把复杂局面一步步理顺的过程。你相信效率与远见，也愿意为结果承担全部责任。",
    strengths:["领导力与规划力顶尖","抗压坚韧，结果导向"],
    cautions:["容易忽略他人感受","对慢节奏的人不耐烦"] }
};

/* ===== 16 型动漫头像配置（差异化人物形象，纯内联 SVG） =====
   style: 0 短发 / 1 长发 / 2 单侧马尾 / 3 刺猬短发；mouth: 0 微笑 / 1 大笑 / 2 抿嘴 / 3 坏笑；acc: 0 无 / 1 眼镜 / 2 发夹 / 3 星光 */
const AVATAR = {

  "ESTP":{hair:"#7A4B2A",hair2:"#5C3820",eye:"#C9822B",bg1:"#FCEFDF",bg2:"#F5D8BC",cloth:"#C86A3A",style:3,mouth:1,acc:0},

  "ESTJ":{hair:"#3C3C3C",hair2:"#282828",eye:"#7A5A3A",bg1:"#F3ECDE",bg2:"#E5D7BD",cloth:"#484850",style:0,mouth:2,acc:1},
  "ESFJ":{hair:"#B5603A",hair2:"#94482A",eye:"#C77A4A",bg1:"#FBEDE6",bg2:"#F3D9CD",cloth:"#CE7A5A",style:2,mouth:0,acc:2},
  "ENFJ":{hair:"#8B5A3C",hair2:"#6E4530",eye:"#B5794A",bg1:"#FBEEDF",bg2:"#F2DAC3",cloth:"#C88A5E",style:1,mouth:0,acc:3},
  "ENTJ":{hair:"#353C4C",hair2:"#242A38",eye:"#4A5A7A",bg1:"#E9EDF4",bg2:"#D5DBE7",cloth:"#3A4250",style:0,mouth:3,acc:1}

/* 生成某个类型的动漫头像 SVG */
function avatarSVG(type){
  const c = AVATAR[type] || AVATAR.INTJ;
  const id = "av" + type;
  const skin = "#FFDFC6", skin2 = "#F1C3A1";
  const grad = `<defs>
    <radialGradient id="bg-${id}" cx="50%" cy="40%" r="72%"><stop offset="0" stop-color="${c.bg1}"/><stop offset="1" stop-color="${c.bg2}"/></radialGradient>
    <linearGradient id="h-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.hair}"/><stop offset="1" stop-color="${c.hair2}"/></linearGradient>
  </defs>`;
  const sparkles = c.acc === 3
    ? `<g fill="#FFF4C2" opacity=".95"><path d="M27 30 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 Z"/><path d="M94 40 l1.2 3.2 3.2 1.2 -3.2 1.2 -1.2 3.2 -1.2 -3.2 -3.2 -1.2 3.2 -1.2 Z"/></g>`
    : "";
  let back = "";
  if(c.style === 0){ back = `<ellipse cx="60" cy="56" rx="31" ry="31" fill="url(#h-${id})"/>`; }
  else if(c.style === 1){ back = `<path d="M27 60 Q25 30 60 29 Q95 30 93 60 L95 114 Q60 106 25 114 Z" fill="url(#h-${id})"/>`; }
  else if(c.style === 2){ back = `<ellipse cx="60" cy="56" rx="31" ry="31" fill="url(#h-${id})"/><path d="M86 50 Q104 66 95 98 Q90 110 81 103 Q91 78 82 60 Z" fill="url(#h-${id})"/>`; }
  else { back = `<path d="M30 58 L35 29 L45 46 L51 25 L60 44 L69 24 L77 46 L86 30 L90 58 Q60 40 30 58 Z" fill="url(#h-${id})"/>`; }
  const bangs = `<path d="M31 55 Q33 33 60 32 Q87 33 89 55 Q82 45 70 47 Q64 41 60 47 Q56 41 50 47 Q38 45 31 55 Z" fill="url(#h-${id})"/>`;
  const side = `<path d="M31 54 Q28 70 33 84 Q36 70 37 58 Z" fill="url(#h-${id})"/><path d="M89 54 Q92 70 87 84 Q84 70 83 58 Z" fill="url(#h-${id})"/>`;
  const eye = (cx) => `<g>
      <ellipse cx="${cx}" cy="63" rx="6.4" ry="7.4" fill="#fff"/>
      <circle cx="${cx}" cy="63.6" r="4.7" fill="${c.eye}"/>
      <circle cx="${cx}" cy="64.4" r="2.3" fill="#2b2433"/>
      <circle cx="${cx-1.7}" cy="61" r="1.6" fill="#fff"/>
      <circle cx="${cx+1.9}" cy="66" r="0.9" fill="#fff" opacity=".85"/>
      <path d="M${cx-6.6} 61 Q${cx} 56.4 ${cx+6.6} 61" stroke="#3a2f3f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>`;
  const brows = `<path d="M41.5 52.5 Q47 49.6 53 52.5" stroke="${c.hair2}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M67 52.5 Q73 49.6 78.5 52.5" stroke="${c.hair2}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  const blush = `<ellipse cx="42" cy="73.5" rx="4.2" ry="2.6" fill="#FF9FB2" opacity=".55"/><ellipse cx="78" cy="73.5" rx="4.2" ry="2.6" fill="#FF9FB2" opacity=".55"/>`;
  const nose = `<path d="M60 67.5 l-2 3.2 3.4 0" stroke="${skin2}" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const mouths = [
    `<path d="M54 79 Q60 85 66 79" stroke="#C0566A" stroke-width="2.4" fill="none" stroke-linecap="round"/>`,
    `<path d="M52 77.5 Q60 88 68 77.5 Q60 83.5 52 77.5 Z" fill="#C0566A"/>`,
    `<path d="M56 80 Q60 83 64 80" stroke="#C0566A" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,
    `<path d="M55 80.5 Q60 84 66 78.5" stroke="#C0566A" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
  ];
  const mouth = mouths[c.mouth] || mouths[0];
  let acc = "";
  if(c.acc === 1){ acc = `<g fill="none" stroke="#3A3F4A" stroke-width="2"><rect x="39.5" y="56.5" width="16" height="13" rx="4.5"/><rect x="64.5" y="56.5" width="16" height="13" rx="4.5"/><line x1="55.5" y1="63" x2="64.5" y2="63"/></g>`; }
  else if(c.acc === 2){ acc = `<path d="M74 37 l2.4 1.8 2.8-1 0.2 3 2.4 1.8 -2.7 1.2 0.1 3 -2.6-1.5 -2.6 1.5 0.1-3 -2.7-1.2 2.4-1.8 0.2-3 Z" fill="#FFD25E" stroke="#E8A93A" stroke-width=".8"/>`; }

  return `<svg class="result-emoji anime" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${type} 动漫形象">
    ${grad}
    <circle cx="60" cy="60" r="58" fill="url(#bg-${id})"/>
    <circle cx="60" cy="60" r="58" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="3"/>
    ${sparkles}
    ${back}
    <path d="M24 118 Q60 92 96 118 Z" fill="${c.cloth}"/>
    <path d="M52 98 Q60 107 68 98" stroke="#ffffff" stroke-width="2.2" fill="none" opacity=".5"/>
    <rect x="54" y="82" width="12" height="13" rx="5" fill="${skin2}"/>
    <ellipse cx="34" cy="64" rx="4.2" ry="6.2" fill="${skin}"/>
    <ellipse cx="86" cy="64" rx="4.2" ry="6.2" fill="${skin}"/>
    <ellipse cx="60" cy="62" rx="26" ry="27" fill="${skin}"/>
    ${bangs}
    ${side}
    ${eye(47)}${eye(73)}
    ${brows}
    ${blush}
    ${nose}
    ${mouth}
    ${acc}
  </svg>`;
}

/* ===== 计分规则（可解释） =====
   1. 每个维度累计该维度全部题目的隐藏分值；
   2. 某维度总分 > 0 取正极字母，< 0 取负极字母；
   3. 总分 == 0 使用固定兜底：EI→I，SN→N，TF→F，JP→P，结果页该维度标注「接近平衡」；
   4. 四维倾向比例：p = (score + maxAbs) / (2 * maxAbs) * 100，maxAbs 为该维度满分（动态计算）。 */
const DIMS = [
  { key:"EI", pos:"E", neg:"I", fallback:"I", posName:"外向", negName:"内向" },
  { key:"SN", pos:"S", neg:"N", fallback:"N", posName:"实感", negName:"直觉" },
  { key:"TF", pos:"T", neg:"F", fallback:"F", posName:"思考", negName:"情感" },
  { key:"JP", pos:"J", neg:"P", fallback:"P", posName:"计划", negName:"随性" }
];
const TOTAL = QUESTIONS.length;

/* 某维度满分（该维度每题最大绝对分值之和） */
function dimMaxAbs(dim){
  let sum = 0;
  for(const q of QUESTIONS){
    if(q.dim !== dim) continue;
    let m = 0;
    for(const o of q.options){ if(Math.abs(o.score) > m) m = Math.abs(o.score); }
    sum += m;
  }
  return sum || 1;
}

/* ===== 状态与本地持久化（刷新尽量恢复进度） ===== */
const STORE_KEY = "mbti_progress_v2";
let state = { answers:new Array(TOTAL).fill(-1), current:0 };
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(Array.isArray(s.answers) && s.answers.length === TOTAL){
      state.answers = s.answers.map(v => (Number.isInteger(v) && v>=-1 && v<=3) ? v : -1);
      state.current = Math.min(Math.max(0, (s.current|0)), TOTAL-1);
    }
  }catch(e){}
}
function resetState(){ state = { answers:new Array(TOTAL).fill(-1), current:0 }; try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
function allDone(){ return state.answers.every(v => v >= 0); }
function answeredCount(){ return state.answers.filter(v => v >= 0).length; }

/* ===== 工具 ===== */
function $(id){ return document.getElementById(id); }
let toastTimer = null;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ===== 路由：start / quiz / result ===== */
function route(){
  const h = (location.hash||"").replace("#","");
  if(h === "result"){ if(allDone()){ showResult(); } else { location.hash = "quiz"; showQuiz(); } }
  else if(h === "quiz"){ showQuiz(); }
  else { showStart(); }
}
window.addEventListener("hashchange", route);

function showStart(){
  document.body.className = "tone-warm";
  setViews("view-start");
  const has = answeredCount() > 0;
  $("btn-start").textContent = has ? "继续上次测试" : "开始测试";
  $("btn-restart").style.display = has ? "" : "none";
  $("start-note").textContent = has ? ("已答 " + answeredCount() + " 题，可继续或重新开始") : "";
}
function setViews(id){
  ["view-start","view-quiz","view-result"].forEach(v => $(v).classList.toggle("active", v === id));
  window.scrollTo(0,0);
}

/* ===== 答题页 ===== */
function showQuiz(){
  document.body.className = "tone-warm";
  setViews("view-quiz");
  renderQuiz();
}
function renderQuiz(){
  const q = QUESTIONS[state.current];
  const done = answeredCount();
  $("q-count").textContent = "第 " + (state.current+1) + " / " + TOTAL + " 题";
  $("q-progress").style.width = (done / TOTAL * 100) + "%";
  $("q-type").textContent = q.judge ? "判断题" : "单选题";
  $("q-text").textContent = q.question;
  $("q-dim").textContent = "第 " + (state.current+1) + " 题 · " + (q.judge ? "请判断是否符合你" : "选最像你的那个");
  const wrap = $("q-options");
  wrap.className = "q-options" + (q.judge ? " judge" : "");
  wrap.innerHTML = "";
  q.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (state.answers[state.current] === i ? " sel" : "");
    b.setAttribute("aria-pressed", state.answers[state.current] === i ? "true" : "false");
    const m = document.createElement("span"); m.className = "mark";
    const t = document.createElement("span"); t.textContent = opt.text;
    b.append(m, t);
    b.addEventListener("click", () => pick(i));
    wrap.appendChild(b);
  });
  $("btn-prev").disabled = (state.current === 0);
  $("btn-next").textContent = (state.current === TOTAL-1) ? "查看结果" : "下一题";
}
function pick(i){
  state.answers[state.current] = i;
  saveState();
  renderQuiz();
}
function next(){
  if(state.answers[state.current] === -1){
    toast("请先选择一个选项再继续");
    $("q-card").classList.remove("shake");
    void $("q-card").offsetWidth;
    $("q-card").classList.add("shake");
    return;
  }
  if(state.current === TOTAL-1){
    if(!allDone()){ state.current = state.answers.indexOf(-1); saveState(); renderQuiz(); return; }
    saveState();
    location.hash = "result";
    return;
  }
  state.current++;
  saveState();
  renderQuiz();
}
function prev(){
  if(state.current > 0){ state.current--; saveState(); renderQuiz(); }
}
$("btn-next").addEventListener("click", next);
$("btn-prev").addEventListener("click", prev);

/* ===== 结果页 ===== */
function calcScores(){
  const scores = { EI:0, SN:0, TF:0, JP:0 };
  QUESTIONS.forEach((q, idx) => {
    const pickIdx = state.answers[idx];
    if(pickIdx >= 0 && q.options[pickIdx]) scores[q.dim] += q.options[pickIdx].score;
  });
  return scores;
}
function showResult(){
  const scores = calcScores();
  const letters = {}, percents = {}, balanced = {};
  DIMS.forEach(d => {
    const s = scores[d.key];
    letters[d.key] = s > 0 ? d.pos : (s < 0 ? d.neg : d.fallback);
    const ma = dimMaxAbs(d.key);
    percents[d.key] = Math.round((s + ma) / (2 * ma) * 100);
    balanced[d.key] = (s === 0);
  });
  const type = DIMS.map(d => letters[d.key]).join("");
  const info = TYPE_INFO[type];
  document.body.className = (type.charAt(0) === "E") ? "tone-warm" : "tone-cool";
  setViews("view-result");
  $("r-emoji").innerHTML = avatarSVG(type);
  $("r-type").textContent = type;
  $("r-name").textContent = info.name;
  $("r-keywords").innerHTML = info.keywords.map(k => '<span class="badge">' + k + "</span>").join("");
  $("r-desc").textContent = info.desc;
  const ul = (id) => { const u = $(id); u.innerHTML = ""; return u; };
  const fillList = (u, arr) => arr.forEach(t => { const li = document.createElement("li"); li.innerHTML = t; u.appendChild(li); });
  fillList(ul("r-strengths"), info.strengths);
  fillList(ul("r-cautions"), info.cautions);
  $("r-bars").innerHTML = DIMS.map(d => {
    const p = percents[d.key];
    const bal = balanced[d.key] ? '<span class="bal">接近平衡</span>' : "";
    const strongSide = p >= 50 ? d.pos : d.neg;
    const strongPct = p >= 50 ? p : (100 - p);
    return '<div class="dim-title">' + d.pos + " / " + d.neg + " 维度" + bal + "</div>" +
      '<div class="bar-wrap"><div class="bar">' +
        '<div class="half"><div class="fill left" style="width:' + p + '%"></div></div>' +
        '<div class="half"><div class="fill right" style="width:' + (100 - p) + '%"></div></div>' +
      "</div>" +
      '<div class="bar-labels"><span><b class="' + (strongSide===d.pos?"strong":"") + '">' + d.pos + "</b> " + d.posName + '</span><span>' + d.negName + " <b class=\"" + (strongSide===d.neg?"strong":"") + '">' + d.neg + "</b></span></div>" +
      '<div style="text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:2px">倾向：' + strongSide + " 侧约 " + strongPct + "%</div></div>";
  }).join("");
}
$("btn-again").addEventListener("click", () => { resetState(); location.hash = "start"; });
$("btn-copy").addEventListener("click", () => {
  const type = $("r-type").textContent;
  const info = TYPE_INFO[type];
  const txt = "我的 MBTI 人格类型是 " + type + "（" + info.name + "）\n关键词：" + info.keywords.join("、") + "\n" + info.desc;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("结果已复制")).catch(()=>fallbackCopy(txt));
  } else { fallbackCopy(txt); }
});
function fallbackCopy(txt){
  const ta = document.createElement("textarea");
  ta.value = txt;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); toast("结果已复制"); }catch(e){ toast("复制失败，请手动复制"); }
  document.body.removeChild(ta);
}
$("btn-start").addEventListener("click", () => { location.hash = "quiz"; });
$("btn-restart").addEventListener("click", () => { resetState(); location.hash = "quiz"; });

/* ===== 启动 ===== */
loadState();
route();
</script>
</body>
